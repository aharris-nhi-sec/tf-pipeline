name: Terraform Test

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      CONJUR_APPLIANCE_URL: https://sme-andrew.secretsmgr.cyberark.cloud/api
      CONJUR_ACCOUNT: conjur

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Authenticate to Conjur via JWT
        id: conjur
        run: |
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=conjur" | jq -r '.value')

          CONJUR_TOKEN=$(curl -s --request POST \
            "${CONJUR_APPLIANCE_URL}/authn-jwt/github/${CONJUR_ACCOUNT}/authenticate" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --header "Accept-Encoding: base64" \
            --data-urlencode "jwt=${JWT}")

          echo "::add-mask::$CONJUR_TOKEN"
          echo "token=$CONJUR_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: terraform init
        env:
          CONJUR_AUTHN_TOKEN: ${{ steps.conjur.outputs.token }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          CONJUR_AUTHN_TOKEN: ${{ steps.conjur.outputs.token }}
